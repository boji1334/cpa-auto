<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="title desc">
  <title id="title">CPAMC API key creation flow</title>
  <desc id="desc">A sanitized diagram showing the visual configuration panel section for adding CPA API keys.</desc>
  <defs>
    <style>
      .bg{fill:#f6f7f9}
      .panel{fill:#fff;stroke:#dde1e7;stroke-width:2}
      .section{fill:#fff;stroke:#d1d5db;stroke-width:2}
      .focus{fill:#fff7ed;stroke:#f97316;stroke-width:4}
      .button{fill:#2563eb}
      .button2{fill:#f3f4f6;stroke:#d1d5db;stroke-width:2}
      .danger{fill:#dc2626}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111827}
      .muted{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#6b7280}
      .tiny{font-size:19px}
      .small{font-size:23px}
      .body{font-size:28px;font-weight:700}
      .label{font-size:22px;font-weight:700;fill:#c2410c}
      .white{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#fff;font-size:22px;font-weight:700}
      .line{stroke:#f97316;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .input{fill:#fff;stroke:#cbd5e1;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="780"/>
  <rect class="panel" x="44" y="36" width="1188" height="708" rx="20"/>
  <text class="text body" x="84" y="92">配置面板 / 网关基础配置</text>
  <text class="muted small" x="84" y="130">切到「可视化」模式后，找到第 02 块认证/API Key。</text>

  <rect class="section" x="84" y="168" width="1100" height="120" rx="16"/>
  <text class="muted tiny" x="114" y="210">01</text>
  <text class="text small" x="164" y="210">服务器与远程管理</text>
  <rect class="input" x="164" y="232" width="400" height="34" rx="8"/>

  <rect class="focus" x="84" y="316" width="1100" height="250" rx="16"/>
  <text class="label" x="114" y="356">02 认证/API Key</text>
  <text class="text small" x="164" y="356">auth-dir</text>
  <rect class="input" x="164" y="374" width="520" height="42" rx="8"/>
  <text class="muted tiny" x="184" y="401">~/.cli-proxy-api</text>

  <text class="text small" x="164" y="462">API 密钥列表 (api-keys)</text>
  <rect class="button" x="910" y="432" width="148" height="44" rx="10"/>
  <text class="white" x="934" y="462">添加 API 密钥</text>

  <rect class="section" x="164" y="494" width="890" height="42" rx="9"/>
  <text class="muted tiny" x="188" y="522">#1 API 密钥  cpa_user_******_demo</text>
  <rect class="button2" x="740" y="500" width="66" height="30" rx="7"/>
  <text class="muted tiny" x="755" y="522">复制</text>
  <rect class="button2" x="816" y="500" width="66" height="30" rx="7"/>
  <text class="muted tiny" x="831" y="522">编辑</text>
  <rect class="danger" x="892" y="500" width="66" height="30" rx="7"/>
  <text class="white" x="908" y="522" style="font-size:18px">删除</text>

  <rect class="section" x="84" y="594" width="1100" height="92" rx="16"/>
  <text class="text small" x="164" y="636">底部操作栏</text>
  <rect class="button" x="932" y="616" width="104" height="44" rx="10"/>
  <text class="white" x="964" y="646">保存</text>
  <rect class="button2" x="1048" y="616" width="104" height="44" rx="10"/>
  <text class="muted small" x="1078" y="646">重载</text>

  <path class="line" d="M985 432 C1018 392 1058 372 1110 356" marker-end="url(#arrow)"/>
  <text class="label" x="874" y="402">1. 点添加</text>

  <rect class="panel" x="770" y="112" width="370" height="180" rx="16"/>
  <text class="text small" x="800" y="150">弹窗里填什么？</text>
  <text class="muted tiny" x="800" y="184">API 密钥：可手动粘贴，也可点「生成」</text>
  <text class="muted tiny" x="800" y="214">建议格式：cpa_用户_用途_随机串</text>
  <text class="muted tiny" x="800" y="244">点「添加」后回到列表，再点底部保存</text>

  <path class="line" d="M984 660 C984 706 720 722 520 704" marker-end="url(#arrow)"/>
  <text class="label" x="712" y="730">2. 保存后测试 /v1/models</text>
</svg>
