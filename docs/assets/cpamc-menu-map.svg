<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">CPAMC menu map</title>
  <desc id="desc">A sanitized diagram showing where to find configuration, auth files, OAuth login, quota management, logs, and system information in CPAMC.</desc>
  <defs>
    <style>
      .bg{fill:#f6f7f9}
      .panel{fill:#fff;stroke:#dde1e7;stroke-width:2}
      .nav{fill:#f9fafb;stroke:#e4e7ec;stroke-width:2}
      .item{fill:#fff;stroke:#dce1e8;stroke-width:1.5}
      .active{fill:#eef2ff;stroke:#5266d8;stroke-width:3}
      .call{fill:#fff7ed;stroke:#f97316;stroke-width:3}
      .text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#111827}
      .muted{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#6b7280}
      .tiny{font-size:20px}
      .small{font-size:24px}
      .body{font-size:28px;font-weight:700}
      .label{font-size:22px;font-weight:700;fill:#c2410c}
      .line{stroke:#f97316;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect class="bg" width="1280" height="760"/>
  <rect class="nav" x="30" y="30" width="270" height="700" rx="16"/>
  <rect class="panel" x="330" y="30" width="920" height="700" rx="18"/>

  <text class="text body" x="72" y="82">CPAMC</text>
  <text class="muted tiny" x="72" y="132">运行</text>
  <rect class="item" x="54" y="150" width="222" height="54" rx="12"/>
  <text class="text small" x="78" y="185">仪表盘</text>

  <text class="muted tiny" x="72" y="244">网关</text>
  <rect class="item" x="54" y="262" width="222" height="54" rx="12"/>
  <text class="text small" x="78" y="297">AI 提供商</text>
  <rect class="item" x="54" y="326" width="222" height="54" rx="12"/>
  <text class="text small" x="78" y="361">认证文件</text>
  <rect class="item" x="54" y="390" width="222" height="54" rx="12"/>
  <text class="text small" x="78" y="425">OAuth 登录</text>

  <text class="muted tiny" x="72" y="484">观测</text>
  <rect class="item" x="54" y="502" width="222" height="54" rx="12"/>
  <text class="text small" x="78" y="537">配额管理</text>
  <rect class="item" x="54" y="566" width="222" height="54" rx="12"/>
  <text class="text small" x="78" y="601">日志查看</text>

  <text class="muted tiny" x="72" y="658">控制</text>
  <rect class="active" x="54" y="676" width="222" height="54" rx="12"/>
  <text class="text small" x="78" y="711">配置面板</text>

  <text class="text body" x="376" y="88">左侧菜单怎么理解</text>
  <rect class="call" x="372" y="130" width="812" height="100" rx="16"/>
  <text class="text small" x="402" y="172">配置面板：创建普通用户 API Key，修改 config.yaml</text>
  <text class="muted tiny" x="402" y="204">入口在「控制」分组，保存后需要应用/重启配置。</text>

  <rect class="panel" x="372" y="260" width="390" height="126" rx="16"/>
  <text class="text small" x="402" y="304">认证文件</text>
  <text class="muted tiny" x="402" y="338">上传/下载/删除 JSON auth 文件</text>
  <text class="muted tiny" x="402" y="366">这是后端账号凭据，不是用户 key</text>

  <rect class="panel" x="790" y="260" width="390" height="126" rx="16"/>
  <text class="text small" x="820" y="304">OAuth 登录</text>
  <text class="muted tiny" x="820" y="338">新增 Codex / Claude / Gemini 等账号</text>
  <text class="muted tiny" x="820" y="366">登录成功后会生成认证文件</text>

  <rect class="panel" x="372" y="420" width="390" height="126" rx="16"/>
  <text class="text small" x="402" y="464">配额管理</text>
  <text class="muted tiny" x="402" y="498">查看 OAuth 账号额度和剩余情况</text>
  <text class="muted tiny" x="402" y="526">不是创建普通用户 API Key 的主入口</text>

  <rect class="panel" x="790" y="420" width="390" height="126" rx="16"/>
  <text class="text small" x="820" y="464">日志查看 / 中心信息</text>
  <text class="muted tiny" x="820" y="498">排查请求、拉取模型、看版本</text>
  <text class="muted tiny" x="820" y="526">模型查询至少需要一个 API Key</text>

  <path class="line" d="M276 703 C315 703 330 180 370 180" marker-end="url(#arrow)"/>
  <text class="label" x="310" y="665">创建用户 key 看这里</text>
</svg>
